<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0E11"><meta name="description" content="社媒运营中控平台"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css?v=4"><title>社媒运营中控平台</title></head><body>
<div id="demoBanner" class="demo-banner" hidden>模拟演示 · 所有跳动数字仅为前端视觉演示</div>
<header class="top"><div><p class="eyebrow">SOCIAL MEDIA OPERATIONS · L0—L3</p><h1>社媒运营中控平台</h1></div><div class="toolbar"><span id="asof">最近采集 —</span><button id="refresh">刷新</button><button id="lock" hidden>锁定</button></div></header>
<main id="dashboard" hidden><section class="control"><div id="projects" class="pills"></div><div class="mode"><button id="liveMode" class="selected">实盘真数</button><button id="demoMode">模拟演示</button></div></section>
<section id="matrix" class="matrix" hidden><div class="section-heading"><div><span class="layer">L1</span><h2>项目矩阵</h2></div><span>指标仅汇总已接入项目的可用数据</span></div><div id="projectCards" class="project-grid"></div></section>
<section class="market"><div class="section-heading"><div><span class="layer">L2</span><h2>平台行情盘口</h2></div><span id="scope"></span></div><div id="platformGrid" class="market-grid"></div><div id="otherPlatforms" class="other-line"></div></section>
<section class="strategy"><div class="section-heading"><div><span class="layer">L3</span><h2>策略建议</h2></div><span>基于最新采集数据自动诊断</span></div><div id="recommendations" class="recommendations"></div></section></main>
<section id="unlock" class="unlock" hidden><form id="unlockForm"><div class="layer">受保护的数据快照</div><h2>输入口令解锁</h2><input id="passphrase" type="password" autocomplete="current-password" placeholder="请输入解锁口令" required><label><input id="remember" type="checkbox"> 本设备记住口令</label><p id="unlockError" role="alert"></p><button>解锁</button></form></section><div id="loading" class="loading">正在读取数据快照…</div>
<script type="module" src="./app.js?v=4"></script></body></html>
